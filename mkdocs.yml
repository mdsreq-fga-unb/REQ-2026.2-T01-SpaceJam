site_name: Space Jam
site_description: Visão de Produto e Projeto — Requisitos de Software (FGA0313) · T01 · 2026.2 · FCTE/UnB
site_author: Equipe Space Jam
site_url: https://mdsreq-fga-unb.github.io/REQ-2026.2-T01-SpaceJam/
repo_url: https://github.com/mdsreq-fga-unb/REQ-2026.2-T01-SpaceJam
repo_name: mdsreq-fga-unb/REQ-2026.2-T01-SpaceJam
edit_uri: edit/docs/docs/
copyright: Equipe Space Jam · Engenharia de Software · FCTE/UnB · 2026.2

theme:
  name: material
  language: pt
  favicon: imagens/space-jam-logo.svg
  logo: imagens/space-jam-logo.svg
  icon:
    logo: material/basketball
    repo: fontawesome/brands/github

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Modo escuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Modo claro

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.top
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight
  - toc:
      permalink: true
      title: Nesta página

plugins:
  - search:
      lang: pt

nav:
  - Início: index.md
  - Unidade 1:
      - "1. Cenário Atual": cenario_atual.md
      - "2. Solução Proposta": solucao.md
      - "3. Intervenção Social": intervencao_social.md
      - "4. Estratégias de Engenharia de Software": estrategia.md
      - "5. Engenharia de Requisitos": engenharia_requisitos.md
      - "6. Cronograma e Entregas": cronograma.md
      - "7. Interação entre Equipe e Cliente": interacao_equipe_cliente.md
      - "9. Entregas": entregas.md
      - "11. Lições Aprendidas": licoes-aprendidas.md
  - Unidade 2:
      - Visão geral: unidade-2.md
      - Requisitos: requisitos.md
  - Reuniões: reunioes.md
  - Arquivo:
      - "Lições Aprendidas (versão anterior)": licoes_aprendidas.md
